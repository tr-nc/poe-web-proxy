[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poe-web-proxy"
version = "0.1.0"
description = "A local, browser-backed Poe chat adapter with an OpenAI-compatible endpoint"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "typer>=0.15,<1"]

[project.scripts]
poe-web-proxy = "poe_web_proxy.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pyright>=1.1,<2", "openai>=1,<3"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
